[project]
name = "tva"
version = "0.1.0"
description = "Small Triton verification library: real computation, memory/concurrency, separate numerical refinement"
# The host the library states (docs/SEMANTICS.md, "Launches"; library issue L107): CPython 3.13 on x86-64.
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
triton = ["triton==3.8.0"]
test = ["pytest>=8"]

[project.scripts]
tva = "tva.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: executes Triton on a GPU", "lean: checks Lean proofs"]
