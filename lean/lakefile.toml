name = "TVA"
version = "2.0.0"
defaultTargets = ["TVA", "vec_add_f32", "grouped_gemm_f16", "flash_attn_fwd_f16"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "TVA"

# One library per kernel folder (kernels/<kernel>/lean); `tvr new` adds these.
[[lean_lib]]
name = "vec_add_f32"
srcDir = "../kernels/vec_add_f32/lean"
roots = ["VecAdd"]

[[lean_lib]]
name = "grouped_gemm_f16"
srcDir = "../kernels/grouped_gemm_f16/lean"
roots = ["GroupedGemm"]

[[lean_lib]]
name = "flash_attn_fwd_f16"
srcDir = "../kernels/flash_attn_fwd_f16/lean"
roots = ["FlashAttn"]
