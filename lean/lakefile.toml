name = "TVA"
version = "2.0.0"
defaultTargets = ["TVA"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "TVA"

# One library per kernel folder (kernels/<kernel>/lean); `tvr new` adds them below.

[[lean_lib]]
name = "vec_add_f32"
srcDir = "../kernels/vec_add_f32/lean"
roots = ["VecAdd"]

